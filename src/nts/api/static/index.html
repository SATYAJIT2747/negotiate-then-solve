<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable Office Agent</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f5d8a; --accent-ink: #ffffff; --ok: #2e7d4f; --warn: #a86a12; --bad: #b23a3a;
  --soft: #eef2f6; --code: #f1efe9; --bar: #2f5d8a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201e; --ink: #ecebe6; --muted: #9c9a93; --line: #34352f;
    --accent: #7fb0e0; --accent-ink: #10171f; --ok: #6cc28f; --warn: #e0a64c; --bad: #e07a7a;
    --soft: #232a31; --code: #2a2b27; --bar: #7fb0e0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 16px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12px; }
header .me { margin-left: auto; display: flex; gap: 10px; align-items: center; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
main.wide { grid-template-columns: 1fr; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.list li:hover { background: var(--soft); }
.list li.sel { border-color: var(--accent); background: var(--soft); }
.list .req { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.small { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-running { color: var(--accent); } .s-waiting { color: var(--warn); } .s-submitted { color: var(--accent); }
.s-approved, .s-answered, .s-passed { color: var(--ok); } .s-declined, .s-escalated { color: var(--warn); }
.s-rejected, .s-model_error, .s-budget_exhausted, .s-stuck, .s-not_committed, .s-failed { color: var(--bad); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button.on { background: var(--soft); border-color: var(--accent); }
.turn { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0; }
.turn.model { border-color: var(--accent); } .turn.ask { border-color: var(--warn); }
.turn.end { border-color: var(--ok); } .turn.bad { border-color: var(--bad); }
.call { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; background: var(--code); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
pre { background: var(--code); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 300px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.callout { border: 1px solid var(--warn); border-radius: 8px; padding: 12px; background: color-mix(in srgb, var(--warn) 8%, transparent); }
.callout.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.data th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover { background: var(--soft); }
table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px; min-width: 640px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 4px; vertical-align: top; }
table.grid th { background: var(--soft); font-weight: 600; }
table.grid td.h { width: 64px; color: var(--muted); white-space: nowrap; }
.cls { background: var(--soft); border-radius: 4px; padding: 3px 5px; margin-bottom: 3px; }
.cls b { display: block; font-weight: 600; }
.scroll { overflow-x: auto; }
.dot { background: var(--warn); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11px; }
.bar { height: 8px; background: var(--bar); border-radius: 4px; min-width: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.login { max-width: 380px; margin: 10vh auto; }
.rule h3 { margin: 0 0 4px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Timetable office agent</h1>
  <span class="meta" id="meta"></span>
  <div class="me" id="who"></div>
</header>
<div id="app"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const label = (s) => esc(String(s ?? "").replaceAll("_", " "));
let me = null, dep = null, current = null, events = [], source = null, view = "requests", timer = null;

function remember(key, value) {
  try { if (value !== undefined) localStorage.setItem(key, value); return localStorage.getItem(key); } catch { return null; }
}

async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, credentials: "same-origin", ...opts});
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; showLogin(); }
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : (body.detail?.message || r.statusText));
  return body;
}

// -- signing in ------------------------------------------------------------------------

async function start() {
  try { me = await api("/api/me"); } catch { me = null; }
  me ? enter() : showLogin();
}

async function showLogin() {
  clearInterval(timer);
  $("who").innerHTML = ""; $("meta").textContent = "";
  const d = await api("/api/departments");
  $("app").innerHTML = `<div class="panel login stack"><h2>Sign in</h2>
    <label class="small" for="ldept">Department</label>
    <select id="ldept">${d.departments.map((x) => `<option value="${esc(x.id)}">${esc(x.id)} (${x.faculty} teachers)</option>`).join("")}</select>
    <label class="small" for="lname">You are</label><select id="lname"></select>
    <input id="lclub" placeholder="The club's name" hidden>
    ${d.passwords ? `<label class="small" for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password">` :
      `<div class="small">This server signs people in by name alone: fine on your own machine, not on a network.</div>`}
    <button class="primary" id="lgo">Sign in</button><div class="small" id="lerr"></div></div>`;
  const fill = () => {
    const x = d.departments.find((y) => y.id === $("ldept").value);
    $("lname").innerHTML = [`<option value="office">The timetable office</option>`, ...x.teachers.map((t) => `<option>${esc(t)}</option>`),
      `<option value="club">A club…</option>`].join("");
    if (remember("nts.name")) $("lname").value = remember("nts.name");
    if (!$("lname").value) $("lname").value = "office";
    $("lclub").hidden = $("lname").value !== "club";
  };
  $("lname").onchange = () => { $("lclub").hidden = $("lname").value !== "club"; };
  $("ldept").onchange = fill;
  if (remember("nts.dept") && d.departments.some((x) => x.id === remember("nts.dept"))) $("ldept").value = remember("nts.dept");
  fill();
  const go = async () => {
    try {
      const name = $("lname").value === "club" ? `club: ${$("lclub").value.trim()}` : $("lname").value;
      await api("/api/login", {method: "POST", body: JSON.stringify({dept: $("ldept").value, name, password: $("lpass")?.value || ""})});
      remember("nts.dept", $("ldept").value); remember("nts.name", $("lname").value);
      me = await api("/api/me"); enter();
    } catch (e) { $("lerr").textContent = e.message; }
  };
  $("lgo").onclick = go;
  if ($("lpass")) $("lpass").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

async function enter() {
  dep = await api("/api/department");
  meta();
  $("who").innerHTML = `<span>${esc(me.name)} <span class="small">· ${esc(me.role)} · ${esc(me.dept)}</span></span><span id="inboxDot"></span>
    <button class="link" id="logout">Sign out</button>`;
  $("logout").onclick = async () => { await api("/api/logout", {method: "POST"}); me = null; current = null; showLogin(); };
  show(view);
  clearInterval(timer); timer = setInterval(() => { if (view === "requests") refreshLists(); }, 4000);
}

function meta() { $("meta").textContent = `${dep.model} · ${dep.agent} · version ${dep.version.slice(0, 8)}`; }

function show(which) {
  view = which;
  if (me.role === "club" && which === "requests") which = view = "bookings";
  const tabs = [...(me.role === "club" ? [] : [["requests", "Requests"]]), ["timetable", "Timetable"], ["bookings", "Bookings"],
    ["fairness", "Fairness"], ["rules", "Rules"], ...(me.role === "office" ? [["semester", "Semester"], ["obs", "Observability"]] : [])];
  const bar = `<div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === which ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if (which === "requests") requestsView(bar);
  else { $("app").innerHTML = `<main class="wide"><section>${bar}<div id="pane" class="panel stack"></div></section></main>`;
    ({timetable: timetableView, bookings: bookingsView, fairness: fairnessView, rules: rulesView, semester: semesterView,
      obs: obsView})[which](); }
  for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => show(b.dataset.tab);
}

// -- requests ----------------------------------------------------------------------------

function requestsView(bar) {
  $("app").innerHTML = `<main><aside class="stack">
    <section class="panel stack"><h2>New request</h2>
      <textarea id="text" placeholder="${me.role === "office" ? "e.g. Lab 2 is closed on Thursday next week for maintenance." : "e.g. I have a conference next Tuesday, please move my classes that day."}"></textarea>
      <div class="row"><label class="small" for="week">Week</label><select id="week">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
        <label class="small"><input type="checkbox" id="simulate"> stand-ins answer</label>
        <button class="primary" id="send" style="margin-left:auto">Send</button></div>
      <div class="small" id="sendErr"></div></section>
    <section class="panel"><h2>Waiting for you</h2><ul class="list" id="inbox"></ul></section>
    <section class="panel"><h2>${me.role === "office" ? "All requests" : "Your requests"}</h2><ul class="list" id="episodes"></ul></section>
  </aside><section>${bar}<div id="viewEp" class="panel stack"><div class="empty">Send a request, or pick one on the left.</div></div></section></main>`;
  $("week").value = remember("nts.week") || 5;
  $("week").onchange = () => remember("nts.week", $("week").value);
  $("simulate").checked = dep.simulate;
  $("send").onclick = send;
  $("text").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); };
  refreshLists();
  if (current) render();
}

async function send() {
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true; $("sendErr").textContent = "";
  try {
    const ep = await api("/api/episodes", {method: "POST", body: JSON.stringify({request: text, week: Number($("week").value), simulate: $("simulate").checked})});
    $("text").value = "";
    open(ep.id); refreshLists();
  } catch (e) { $("sendErr").textContent = e.message; }
  $("send").disabled = false;
}

async function refreshLists() {
  if (!$("episodes")) return;
  try {
    const [eps, inbox] = await Promise.all([api("/api/episodes"), api("/api/inbox")]);
    $("episodes").innerHTML = eps.length ? eps.map(item).join("") : `<li class="small">None yet.</li>`;
    $("inbox").innerHTML = inbox.length ? inbox.map(item).join("") : `<li class="small">Nothing waits for you.</li>`;
    if ($("inboxDot")) $("inboxDot").innerHTML = inbox.length ? `<span class="dot">${inbox.length}</span>` : "";
    for (const li of document.querySelectorAll("li[data-id]")) li.onclick = () => open(li.dataset.id);
  } catch { /* the server may be restarting */ }
}

function item(e) {
  return `<li data-id="${esc(e.id)}" class="${current?.id === e.id ? "sel" : ""}"><div class="req">${esc(e.request)}</div>
    <div class="row small"><span class="badge s-${esc(e.status)}">${label(e.status)}</span>${esc(e.actor)}${e.week ? ` · week ${e.week}` : ""}</div></li>`;
}

async function open(id) {
  if (view !== "requests") show("requests");
  if (source) source.close();
  events = [];
  current = await api(`/api/episodes/${id}`);
  render(); follow();
}

function follow() {
  if (!current) return;
  const id = current.id;
  source = new EventSource(`/api/episodes/${id}/events?after=${events.length}`);
  const take = async (msg) => {
    const e = JSON.parse(msg.data);
    if (current?.id !== id || e.n < events.length) return;
    events.push(e);
    if (["end", "waiting", "decision"].includes(e.type)) { current = await api(`/api/episodes/${id}`); refreshLists(); }
    render();
  };
  for (const t of ["model", "model_error", "tool", "reply", "waiting", "end", "decision"]) source.addEventListener(t, take);
  source.onerror = () => source.close();  // the server ends the stream when the episode ends or waits: do not reconnect
}

const args = (a) => Object.entries(a || {}).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");

function eventHtml(e) {
  if (e.type === "model") {
    const calls = e.calls.map((c) => `<span class="call">${esc(c.name)}(${esc(args(c.arguments))})</span>`).join(" ");
    return `<div class="turn model"><div class="small">agent · ${Math.round(e.ms)} ms</div>${e.text ? `<div>${esc(e.text)}</div>` : ""}${calls}</div>`;
  }
  if (e.type === "tool") return `<div class="turn ${e.ok ? "" : "bad"}"><details><summary>${esc(e.name)} ${e.ok ? "answered" : "refused: " + esc(e.result?.message || "")}</summary>
      <pre>${esc(JSON.stringify(e.result, null, 1))}</pre></details></div>`;
  if (e.type === "reply") {
    const what = e.kind === "offer" ? `asked ${esc(e.to)} to waive <i>${esc(e.rule)}</i>` : e.kind === "notice" ? `told ${esc(e.to)}` : `asked ${esc(e.to)}`;
    const yn = e.answer === "yes" || e.answer === "no" ? ` <span class="badge s-${e.answer === "yes" ? "approved" : "rejected"}">${e.answer}</span>` : "";
    const ans = e.kind === "notice" ? "" : `<div><b>${esc(e.to)}:</b> ${e.answer === "no_reply" ? "<i>no reply</i>" : esc(e.says)}${yn}</div>`;
    return `<div class="turn ask"><div class="small">${what}</div><div>“${esc(e.text)}”</div>${ans}</div>`;
  }
  if (e.type === "model_error") return `<div class="turn bad">The model failed: ${esc(e.error?.message || "")}</div>`;
  if (e.type === "waiting") return `<div class="turn ask small">Waiting for an answer…</div>`;
  if (e.type === "end") return `<div class="turn end"><span class="badge s-${esc(e.status)}">${label(e.status)}</span> ${esc(e.text || e.detail)}
    <div class="small">${e.turns ?? "?"} turns · ${e.tool_calls ?? "?"} tool calls · ${e.refused ?? 0} refused</div></div>`;
  if (e.type === "decision") return `<div class="turn end small">${e.approved ? `Approved by the office: committed as version ${esc((e.version || "").slice(0, 8))}` : `Not approved${e.note ? ": " + esc(e.note) : ""}`}</div>`;
  return "";
}

function render() {
  if (!$("viewEp")) return;
  for (const li of document.querySelectorAll("#episodes li, #inbox li")) li.classList.toggle("sel", li.dataset.id === current?.id);
  if (!current) return;
  const c = current, p = c.pending, can = c.can || {};
  let html = `<div><div class="small">${esc(c.actor)}${c.week ? ` · week ${c.week}` : ""} · ${esc(c.started.replace("T", " "))}</div>
    <div style="font-size:16px;margin-top:4px">${esc(c.request)}</div></div>`;
  html += events.map(eventHtml).join("") + (c.busy || c.status === "running" ? `<div class="small">The agent is working…</div>` : "");
  if (p && !c.busy) {
    html += `<div class="callout stack"><div class="small">${p.kind === "offer" ? `An offer for ${esc(p.to)}` : `A question for ${esc(p.to)}`}</div>
      <div>“${esc(p.text)}”</div>${p.rule ? `<div class="small">Their rule: ${esc(p.rule)}; waived in ${p.weeks.length ? "week " + p.weeks.join(", ") : "every week"}</div>` : ""}
      ${can.answer ? `<textarea id="answer" placeholder="${p.kind === "offer" ? "Say why (optional)" : "Your answer"}"></textarea>
      <div class="row">${p.kind === "offer" ? `<button class="primary" data-a="yes">Agree</button><button data-a="no">Refuse</button>` :
        `<button class="primary" data-a="said">Answer</button>`}<button data-a="no_reply">Don't answer</button></div>` :
        `<div class="small">Waiting for ${esc(p.to)} to answer.</div>`}</div>`;
  }
  if (c.status === "submitted" || c.decision) {
    html += `<div class="callout ok stack"><div class="small">The draft${c.decision ? "" : ", waiting for the office"}</div>
      <ul>${c.draft.map((d) => `<li>${esc(d)}</li>`).join("") || "<li>(no rule changes)</li>"}</ul>
      ${c.stale ? `<div class="small">The timetable changed since this draft was made; run the request again.</div>` : ""}
      ${can.decide && !c.stale ? `<div class="row"><button class="primary" id="approve">Approve and commit</button><input id="note" placeholder="Note (for a rejection)"><button class="danger" id="reject">Reject</button></div>` : ""}</div>`;
  }
  $("viewEp").innerHTML = html;
  for (const b of document.querySelectorAll("[data-a]")) b.onclick = () => answer(b.dataset.a);
  if ($("approve")) $("approve").onclick = () => decide("approve");
  if ($("reject")) $("reject").onclick = () => decide("reject");
}

async function answer(kind) {
  const text = $("answer")?.value.trim() || "";
  if (kind === "said" && !text) { $("answer").focus(); return; }
  try {
    await api(`/api/episodes/${current.id}/reply`, {method: "POST", body: JSON.stringify({answer: kind, text})});
    current = await api(`/api/episodes/${current.id}`);
    render(); follow(); refreshLists();
  } catch (e) { alert(e.message); }
}

async function decide(what) {
  try {
    await api(`/api/episodes/${current.id}/${what}`, {method: "POST", body: what === "reject" ? JSON.stringify({note: $("note").value}) : "{}"});
    current = await api(`/api/episodes/${current.id}`);
    events = []; follow(); refreshLists();
    dep = await api("/api/department"); meta();
  } catch (e) { alert(e.message); }
}

// -- timetable ----------------------------------------------------------------------------

function timetableView() {
  $("pane").innerHTML = `<div class="row"><label class="small" for="ttWeek">Week</label>
    <select id="ttWeek">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
    <label class="small" for="ttWho">Show</label><select id="ttWho"><option value="">Everyone</option>
    ${dep.teachers.map((t) => `<option value="t:${esc(t)}">${esc(t)}</option>`).join("")}${dep.sections.map((s) => `<option value="s:${esc(s)}">${esc(s)}</option>`).join("")}</select>
    <span class="small" id="ttNote"></span></div><div class="scroll" id="ttGrid"></div>`;
  $("ttWeek").value = remember("nts.week") || 5;
  if (me.role === "teacher") $("ttWho").value = `t:${me.name}`;
  $("ttWeek").onchange = $("ttWho").onchange = drawTimetable;
  drawTimetable();
}

async function drawTimetable() {
  const who = $("ttWho").value, q = new URLSearchParams({week: $("ttWeek").value});
  if (who.startsWith("t:")) q.set("teacher", who.slice(2));
  if (who.startsWith("s:")) q.set("section", who.slice(2));
  try {
    const t = await api(`/api/timetable?${q}`);
    $("ttNote").textContent = t.own ? "this week has its own timetable" : "the semester timetable runs this week";
    const cell = (day, h) => t.classes.filter((c) => c.day === day && c.from === h).map((c) =>
      `<div class="cls"><b>${esc(c.course)}</b>${esc(c.kind)} · ${esc(c.teacher)}<br>${esc(c.sections.join(", "))} · ${esc(c.room)}</div>`).join("");
    $("ttGrid").innerHTML = `<table class="grid"><tr><th class="h"></th>${dep.days.map((d) => `<th>${esc(d)}</th>`).join("")}</tr>` +
      dep.hours.slice(0, -1).map((h) => `<tr><td class="h">${esc(h)}${h === dep.lunch ? "<br>lunch" : ""}</td>${dep.days.map((d) => `<td>${cell(d, h)}</td>`).join("")}</tr>`).join("") + "</table>";
  } catch (e) { $("ttGrid").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// -- fairness and rules ----------------------------------------------------------------------

async function fairnessView() {
  const f = await api("/api/fairness");
  const top = Math.max(...f.teachers.map((t) => t.burden), 0.0001);
  $("pane").innerHTML = `<div class="tiles">
      <div class="tile"><div class="small">Concessions this term</div><div class="v">${f.concessions.length}</div></div>
      <div class="tile"><div class="small">Gini of the burden</div><div class="v">${f.spread.gini.toFixed(2)}</div><div class="small">0: even, 1: one person carries it</div></div>
      <div class="tile"><div class="small">Largest burden</div><div class="v">${f.spread.max.toFixed(2)}</div></div></div>
    <p class="small">When a teacher agrees to waive one of their rules for someone else's request, it counts here: the rule's weight
      (its tier and how it was justified) times how much was given up (some weeks: half; dropped: all). The agent asks
      first whoever has given way less.</p>
    <table class="data"><tr><th>Teacher</th><th>Given way</th><th>Burden</th><th style="width:35%"></th><th>For</th></tr>
    ${f.teachers.map((t) => `<tr><td>${esc(t.teacher)}</td><td class="n">${t.given_way}</td><td class="n">${t.burden.toFixed(2)}</td>
      <td><div class="bar" style="width:${(100 * t.burden / top).toFixed(1)}%"></div></td><td class="small">${esc(t.for.join(", "))}</td></tr>`).join("")}</table>`;
}

async function rulesView() {
  $("pane").innerHTML = dep.rules ? `<div class="row"><input id="rq" placeholder="Search the regulations: lunch, Saturday, make-up classes…" style="flex:1">
    </div><div id="rlist" class="stack"></div>` : `<div class="empty">No regulations are loaded for this department.</div>`;
  if (!dep.rules) return;
  let t = null;
  const draw = async () => {
    const r = await api(`/api/rules?q=${encodeURIComponent($("rq").value)}`);
    $("rlist").innerHTML = r.rules.map((x) => `<div class="rule"><h3>§${esc(x.number)} ${esc(x.title)} <span class="small">[${esc(x.id)}]</span></h3><div>${esc(x.text)}</div></div>`).join("")
      || `<div class="empty">No rule matches.</div>`;
  };
  $("rq").oninput = () => { clearTimeout(t); t = setTimeout(draw, 200); };
  draw();
}

// -- room bookings ----------------------------------------------------------------------------------

async function bookingsView() {
  const canBook = me.role === "club" || me.role === "office";
  const hours = dep.hours;
  $("pane").innerHTML = `${canBook ? `<h2>Book a room</h2><div class="row">
      ${me.role === "office" ? `<input id="bclub" placeholder="Club" style="width:130px">` : ""}
      <input id="bpurpose" placeholder="What for" style="flex:1;min-width:160px">
      <label class="small" for="bweek">Week</label><select id="bweek">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
      <select id="bday">${dep.days.map((d) => `<option>${esc(d)}</option>`).join("")}</select>
      <select id="bfrom">${hours.slice(0, -1).map((h) => `<option>${esc(h)}</option>`).join("")}</select>
      <span class="small">to</span><select id="bto">${hours.slice(1).map((h) => `<option>${esc(h)}</option>`).join("")}</select>
      <input id="bpeople" type="number" min="1" value="20" style="width:80px" aria-label="People">
      <select id="broom"><option value="">any room</option>${dep.rooms.map((r) => `<option>${esc(r)}</option>`).join("")}</select>
      <button class="primary" id="bgo">Book</button></div><div id="bout"></div>` :
      `<p class="small">Clubs book rooms here; a booking closes the room for teaching then, so no class is ever moved into it.</p>`}
    <h2 style="margin-top:12px">${me.role === "club" ? "Your bookings" : "Bookings"}</h2><div class="scroll" id="blist"></div>`;
  if (canBook) {
    $("bweek").value = remember("nts.week") || 5;
    $("bgo").onclick = async () => {
      const body = {purpose: $("bpurpose").value.trim() || "a meeting", week: Number($("bweek").value), day: $("bday").value,
        from_hour: $("bfrom").value, to_hour: $("bto").value, attendees: Number($("bpeople").value), room: $("broom").value || null,
        ...(me.role === "office" ? {club: $("bclub").value} : {})};
      try {
        const d = await api("/api/bookings", {method: "POST", body: JSON.stringify(body)});
        $("bout").innerHTML = `<div class="callout ${d.status === "booked" ? "ok" : ""} stack" style="margin-top:10px">
          <div><span class="badge s-${d.status === "booked" ? "approved" : d.status === "refused" ? "rejected" : "waiting"}">${label(d.status)}</span> ${d.room ? esc(d.room) : ""}</div>
          <ul>${d.checks.map((c) => `<li>${c.ok ? "✓" : "✗"} ${esc(c.check)}: ${esc(c.detail)}</li>`).join("")}</ul>
          ${d.alternatives.length ? `<div class="small">These would work:</div><ul>${d.alternatives.map((a) => `<li>${esc(a.room)}, ${esc(a.day)} ${esc(a.from)} to ${esc(a.to)}</li>`).join("")}</ul>` : ""}</div>`;
        drawBookings();
      } catch (e) { $("bout").innerHTML = `<div class="small">${esc(e.message)}</div>`; }
    };
  }
  drawBookings();
}

async function drawBookings() {
  const rows = await api("/api/bookings");
  $("blist").innerHTML = rows.length ? `<table class="data"><tr><th>Week</th><th>When</th><th>Room</th><th>Club</th><th>What</th><th>People</th><th>Status</th><th></th></tr>
    ${rows.map((r) => `<tr><td class="n">${r.week}</td><td>${esc(r.day)} ${esc(r.from)}–${esc(r.to)}</td><td>${esc(r.room)}</td><td>${esc(r.club)}</td><td>${esc(r.purpose)}</td>
      <td class="n">${r.attendees}</td><td><span class="badge s-${r.status === "booked" ? "approved" : "waiting"}">${label(r.status)}</span></td>
      <td>${me.role === "office" && r.status === "needs_approval" ? `<button data-bok="${esc(r.id)}">Approve</button> <button class="danger" data-bno="${esc(r.id)}">Refuse</button>` :
        me.role === "office" || me.role === "club" ? `<button class="link" data-bx="${esc(r.id)}">Cancel</button>` : ""}</td></tr>`).join("")}</table>` : `<div class="empty">No bookings yet.</div>`;
  const act = (sel, f) => { for (const b of document.querySelectorAll(sel)) b.onclick = async () => { try { await f(b); } catch (e) { alert(e.message); } drawBookings(); }; };
  act("[data-bok]", (b) => api(`/api/bookings/${b.dataset.bok}/approve`, {method: "POST"}));
  act("[data-bno]", (b) => api(`/api/bookings/${b.dataset.bno}/refuse`, {method: "POST"}));
  act("[data-bx]", (b) => api(`/api/bookings/${b.dataset.bx}`, {method: "DELETE"}));
}

// -- the semester timetable (the office) --------------------------------------------------------------

async function semesterView() {
  $("pane").innerHTML = `<p class="small">During term every change is a repair that moves as few classes as it can, so wishes added one by one
    are met only where a repair allowed it. A rebuild solves the semester timetable again from nothing, with every standing rule and wish;
    weeks from the one you pick that have their own timetable are repaired on top of it, earlier weeks stay as they ran.
    Nothing changes until you publish it.</p>
    <div class="row"><label class="small" for="sweek">Repair weeks from</label><select id="sweek">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
    <button class="primary" id="sgo">Rebuild</button></div><div id="sout"></div>`;
  $("sweek").value = remember("nts.week") || 5;
  $("sgo").onclick = async () => {
    try { await api("/api/semester/rebuild", {method: "POST", body: JSON.stringify({from_week: Number($("sweek").value)})}); } catch (e) { alert(e.message); }
    pollRebuild();
  };
  pollRebuild();
}

async function pollRebuild() {
  if (view !== "semester") return;
  const r = await api("/api/semester/rebuild");
  const st = r.stats;
  $("sout").innerHTML = r.status === "none" ? "" : r.status === "running" ? `<div class="small">Solving… (a minute at most)</div>` :
    r.status === "failed" ? `<div class="callout">${esc(r.error)}</div>` : r.status === "published" ? `<div class="callout ok">Published as version ${esc((r.version || "").slice(0, 8))}.</div>` :
    `<div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="small">Classes that move</div><div class="v">${st.moved} <span class="small">of ${st.classes}</span></div></div>
      <div class="tile"><div class="small">Wishes met now</div><div class="v">${st.met_before} <span class="small">of ${st.wishes}</span></div></div>
      <div class="tile"><div class="small">Wishes met after</div><div class="v">${st.met_after} <span class="small">of ${st.wishes}</span></div></div>
      <div class="tile"><div class="small">Weeks repaired / kept</div><div class="v">${st.weeks_repaired.length} / ${st.weeks_kept.length}</div></div></div>
      ${r.unmet.length ? `<details style="margin-top:8px"><summary>Wishes still not met (${r.unmet.length})</summary><ul>${r.unmet.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></details>` : ""}
      ${r.stale ? `<div class="callout" style="margin-top:8px">The timetable changed since this rebuild; rebuild again.</div>` :
        `<div class="row" style="margin-top:12px"><button class="primary" id="spub">Publish</button></div>`}`;
  if ($("spub")) $("spub").onclick = async () => { try { await api("/api/semester/publish", {method: "POST"}); dep = await api("/api/department"); meta(); } catch (e) { alert(e.message); } pollRebuild(); };
  if (r.status === "running") setTimeout(pollRebuild, 1000);
}

// -- observability (the office) -----------------------------------------------------------------

async function obsView() {
  $("pane").innerHTML = `<div class="row"><label class="small" for="days">Last</label><select id="days"><option>1</option><option selected>7</option><option>30</option><option>365</option></select><span class="small">days</span></div>
    <div id="otiles"></div><div id="omodels"></div><div class="row"><div id="oerr" style="flex:1;min-width:260px"></div><div id="otools" style="flex:1;min-width:260px"></div></div>
    <h2>Episodes</h2><div class="row"><select id="ostatus"><option value="">any status</option>${["answered", "submitted", "declined", "escalated", "waiting", "budget_exhausted", "stuck", "model_error"].map((s) => `<option value="${s}">${label(s)}</option>`).join("")}</select>
    <select id="overdict"><option value="">any verdict</option><option>passed</option><option>failed</option><option>approved</option><option>rejected</option></select>
    <input id="omodel" placeholder="model contains…"></div><div class="scroll" id="oeps"></div><div id="otrace"></div>
    <h2>Eval reports</h2><div class="scroll" id="oevals"></div>`;
  $("days").onchange = overview;
  $("ostatus").onchange = $("overdict").onchange = $("omodel").onchange = episodesTable;
  overview(); episodesTable(); evals();
}

async function overview() {
  const o = await api(`/api/obs/overview?days=${$("days").value}`);
  const s = o.status;
  $("otiles").innerHTML = `<div class="tiles">${[["Episodes", o.episodes], ["Submitted", s.submitted || 0], ["Answered", s.answered || 0],
    ["Declined or escalated", (s.declined || 0) + (s.escalated || 0)], ["Failed to finish", (s.budget_exhausted || 0) + (s.stuck || 0) + (s.model_error || 0)]]
    .map(([k, v]) => `<div class="tile"><div class="small">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
  $("omodels").innerHTML = `<h2 style="margin-top:16px">Models</h2><div class="scroll"><table class="data"><tr><th>Model</th><th>Episodes</th><th>Judged pass</th><th>Tokens</th><th>Calls refused</th><th>Seconds</th></tr>
    ${o.models.map((m) => `<tr><td>${esc(m.model)}</td><td class="n">${m.episodes}</td><td class="n">${m.judged ? `${m.passed}/${m.judged} (${Math.round(100 * m.passed / m.judged)}%)` : "–"}</td>
      <td class="n">${m.tokens.toLocaleString()}</td><td class="n">${m.tool_calls ? `${m.refused}/${m.tool_calls}` : "–"}</td><td class="n">${Math.round(m.seconds)}</td></tr>`).join("")}</table></div>`;
  const bars = (title, rows) => { const top = Math.max(...rows.map((r) => r[1]), 1);
    return `<h2 style="margin-top:16px">${title}</h2><table class="data">${rows.map(([k, v]) => `<tr><td>${label(k)}</td><td class="n">${v}</td><td style="width:45%"><div class="bar" style="width:${(100 * v / top).toFixed(1)}%"></div></td></tr>`).join("") || `<tr><td class="small">none</td></tr>`}</table>`; };
  $("oerr").innerHTML = bars("Refused calls, by reason", o.errors);
  $("otools").innerHTML = bars("Tool calls", o.tools);
}

async function episodesTable() {
  const q = new URLSearchParams({limit: 100});
  if ($("ostatus").value) q.set("status", $("ostatus").value);
  if ($("overdict").value) q.set("verdict", $("overdict").value);
  if ($("omodel").value) q.set("model", $("omodel").value);
  const eps = await api(`/api/obs/episodes?${q}`);
  $("oeps").innerHTML = `<table class="data"><tr><th>When</th><th>Request</th><th>Model</th><th>Status</th><th>Verdict</th><th>Turns</th><th>Refused</th><th>Tokens</th></tr>
    ${eps.map((e) => `<tr class="click" data-trace="${esc(e.id)}"><td class="small">${esc(e.start.replace("T", " "))}</td><td>${esc(e.request)}${e.family ? ` <span class="small">${esc(e.family)}</span>` : ""}</td>
      <td class="small">${esc(e.model)}</td><td><span class="badge s-${esc(e.status)}">${label(e.status)}</span></td>
      <td>${e.verdict ? `<span class="badge s-${esc(e.verdict)}">${esc(e.verdict)}</span>` : ""}</td><td class="n">${e.turns}</td><td class="n">${e.refused}</td><td class="n">${e.tokens.toLocaleString()}</td></tr>`).join("")}</table>`;
  for (const tr of document.querySelectorAll("tr[data-trace]")) tr.onclick = () => trace(tr.dataset.trace);
}

async function trace(id) {
  const spans = await api(`/api/obs/trace/${id}`);
  const line = (s) => {
    const a = s.attrs;
    if (s.kind === "model_call") { const r = a.response || {}; return `${esc(r.text || "")} ${(r.tool_calls || []).map((c) => `<span class="call">${esc(c.name)}(${esc(args(c.arguments))})</span>`).join(" ")}`; }
    if (s.kind === "tool_call") return a.ok ? "ok" : `<span class="s-failed">${esc(a.result?.error?.code)}: ${esc(a.result?.error?.message)}</span>`;
    if (s.kind === "reply") return `“${esc(a.ask?.text)}” → ${esc(a.reply?.answer)} ${esc(a.reply?.text)}`;
    if (s.kind === "evaluation") return a.passed ? `<span class="s-passed">passed</span>` : `<span class="s-failed">failed: ${esc((a.failures || []).join("; "))}</span>`;
    if (s.kind === "episode" || s.kind === "resume") return `${label(a.status)} ${esc(a.text || a.detail || "")}`;
    if (s.kind === "approval") return a.committed ? "committed" : `not committed ${esc(a.note || a.reason || "")}`;
    return "";
  };
  $("otrace").innerHTML = `<div class="panel stack" style="margin-top:12px"><div class="row"><h2 style="margin:0">Trace ${esc(id)}</h2><button class="link" id="tclose" style="margin-left:auto">Close</button></div>
    <table class="data"><tr><th>Span</th><th>Name</th><th>ms</th><th>What</th></tr>${spans.filter((s) => s.kind !== "turn").map((s) =>
      `<tr><td class="small">${esc(s.kind)}</td><td>${esc(s.name)}</td><td class="n">${Math.round(s.ms)}</td><td>${line(s)}<details><summary>attributes</summary><pre>${esc(JSON.stringify(s.attrs, null, 1))}</pre></details></td></tr>`).join("")}</table></div>`;
  $("tclose").onclick = () => { $("otrace").innerHTML = ""; };
  $("otrace").scrollIntoView({behavior: "smooth"});
}

async function evals() {
  const r = await api("/api/obs/evals");
  $("oevals").innerHTML = `<table class="data"><tr><th>Report</th><th>Model</th><th>When</th><th>Passed</th><th>Families</th></tr>
    ${r.map((x) => `<tr><td>${esc(x.report)}</td><td class="small">${esc(x.model)}</td><td class="small">${esc(x.when.replace("T", " "))}</td>
      <td class="n">${x.n ? `${x.passed}/${x.n}` : "–"}</td><td class="small">${Object.entries(x.families).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</td></tr>`).join("")}</table>`;
}

start().catch((e) => { $("app").innerHTML = `<div class="empty">Could not reach the API: ${esc(e.message)}</div>`; });
</script>
