<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable Office Agent</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
  --accent: #2f5d8a; --accent-ink: #ffffff; --ok: #2e7d4f; --warn: #a86a12; --bad: #b23a3a;
  --soft: #eef2f6; --code: #f1efe9; --bar: #2f5d8a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161715; --panel: #1f201e; --ink: #ecebe6; --muted: #9c9a93; --line: #34352f;
    --accent: #7fb0e0; --accent-ink: #10171f; --ok: #6cc28f; --warn: #e0a64c; --bad: #e07a7a;
    --soft: #232a31; --code: #2a2b27; --bar: #7fb0e0;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; gap: 16px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .meta { color: var(--muted); font-size: 12px; }
header .me { margin-left: auto; display: flex; gap: 10px; align-items: center; }
select, input, textarea, button { font: inherit; color: inherit; }
select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
main.wide { grid-template-columns: 1fr; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.list li:hover { background: var(--soft); }
.list li.sel { border-color: var(--accent); background: var(--soft); }
.list .req { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.small { font-size: 12px; color: var(--muted); }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-running { color: var(--accent); } .s-waiting { color: var(--warn); } .s-submitted { color: var(--accent); }
.s-approved, .s-answered, .s-passed { color: var(--ok); } .s-declined, .s-escalated { color: var(--warn); }
.s-rejected, .s-model_error, .s-budget_exhausted, .s-stuck, .s-not_committed, .s-failed { color: var(--bad); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button.on { background: var(--soft); border-color: var(--accent); }
.turn { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 8px 0; }
.turn.model { border-color: var(--accent); } .turn.ask { border-color: var(--warn); }
.turn.end { border-color: var(--ok); } .turn.bad { border-color: var(--bad); }
.call { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; background: var(--code); border-radius: 4px; padding: 1px 6px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
pre { background: var(--code); padding: 8px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 300px; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.callout { border: 1px solid var(--warn); border-radius: 8px; padding: 12px; background: color-mix(in srgb, var(--warn) 8%, transparent); }
.callout.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
table.data th { color: var(--muted); font-weight: 600; font-size: 12px; }
table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover { background: var(--soft); }
table.grid { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px; min-width: 640px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 4px; vertical-align: top; }
table.grid th { background: var(--soft); font-weight: 600; }
table.grid td.h { width: 64px; color: var(--muted); white-space: nowrap; }
.cls { background: var(--soft); border-radius: 4px; padding: 3px 5px; margin-bottom: 3px; }
.cls b { display: block; font-weight: 600; }
.scroll { overflow-x: auto; }
.dot { background: var(--warn); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11px; }
.bar { height: 8px; background: var(--bar); border-radius: 4px; min-width: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.login { max-width: 380px; margin: 10vh auto; }
main.chat { grid-template-columns: 280px 1fr; height: calc(100vh - 54px); }
main.chat .side { overflow-y: auto; }
main.chat .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 6px; font-weight: 600; }
.convo { display: flex; flex-direction: column; min-height: 0; }
.msgs { flex: 1; overflow-y: auto; padding: 4px 4px 12px; }
.msg { display: flex; flex-direction: column; margin: 10px 0; max-width: 820px; }
.msg.user { align-items: flex-end; margin-left: auto; }
.msg .bubble { padding: 9px 13px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--soft); border-color: transparent; }
.msg .bubble.ask { border-color: var(--warn); }
.msg.agent > * + * { margin-top: 8px; }
.thinking { border-left: 2px solid var(--line); padding: 2px 0 2px 10px; }
.thinking > summary { font-size: 13px; }
.thinking ol { margin: 6px 0 0; padding-left: 20px; }
.thinking li { margin: 3px 0; }
.thinking li.bad { color: var(--bad); }
.thinking li.note { color: var(--muted); font-style: italic; list-style: none; margin-left: -20px; }
.thinking li details { display: inline-block; margin-left: 6px; }
.composer { margin-top: 8px; }
.composer textarea { min-height: 44px; }
.s-replaced, .s-interrupted { color: var(--muted); }
main.chat.closed { grid-template-columns: 1fr; }
main.chat.closed .side { display: none; }
.topbar { flex-wrap: nowrap; align-items: flex-start; }
.topbar .tabs { flex: 1; }
.side-btn { font-size: 20px; line-height: 1; padding: 6px 4px; color: var(--muted); }
.side-btn:hover { color: var(--ink); }
/* scroll bars only while the pointer is over what scrolls */
.msgs, main.chat .side { scrollbar-width: thin; scrollbar-color: transparent transparent; }
.msgs:hover, main.chat .side:hover { scrollbar-color: var(--line) transparent; }
.msgs::-webkit-scrollbar, main.chat .side::-webkit-scrollbar { width: 8px; }
.msgs::-webkit-scrollbar-thumb, main.chat .side::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
.msgs:hover::-webkit-scrollbar-thumb, main.chat .side:hover::-webkit-scrollbar-thumb { background: var(--line); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.pick { border-radius: 999px; border-color: var(--accent); color: var(--accent); padding: 4px 12px; }
.pick:hover { background: var(--soft); }
.bubble.office { border-color: var(--accent); border-left-width: 3px; }
.office-item { max-width: 900px; }
.bellbox { position: relative; }
.bell { font-size: 18px; position: relative; }
.bell .dot { position: absolute; top: -6px; right: -10px; }
.bell-panel { position: absolute; right: 0; top: 30px; width: min(420px, 90vw); max-height: 70vh; overflow-y: auto; z-index: 10;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast { position: fixed; right: 20px; bottom: 20px; width: min(380px, 90vw); z-index: 20; cursor: pointer;
  border-left: 4px solid var(--accent); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.notice { padding: 8px; border-radius: 6px; cursor: pointer; border-top: 1px solid var(--line); }
.notice:hover { background: var(--soft); }
.notice.new { border-left: 3px solid var(--accent); }
@media (max-width: 860px) { main.chat { height: auto; } .msgs { max-height: 70vh; } }
.rule h3 { margin: 0 0 4px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Timetable office agent</h1>
  <span class="meta" id="meta"></span>
  <div class="me" id="who"></div>
</header>
<div id="app"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const label = (s) => esc(String(s ?? "").replaceAll("_", " "));
let me = null, dep = null, source = null, view = "requests", timer = null;

function remember(key, value) {
  try { if (value !== undefined) localStorage.setItem(key, value); return localStorage.getItem(key); } catch { return null; }
}

// Each browser tab keeps its own session (sessionStorage), so one tab can be a teacher and another the office.
function tabToken(value) {
  try { if (value !== undefined) value ? sessionStorage.setItem("nts.token", value) : sessionStorage.removeItem("nts.token");
    return sessionStorage.getItem("nts.token"); } catch { return null; }
}

async function api(path, opts = {}) {
  const auth = tabToken() ? {Authorization: `Bearer ${tabToken()}`} : {};
  const r = await fetch(path, {headers: {"Content-Type": "application/json", ...auth}, credentials: "same-origin", ...opts});
  const body = await r.json().catch(() => ({}));
  if (r.status === 401 && me) { me = null; showLogin(); }
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : (body.detail?.message || r.statusText));
  return body;
}

// -- signing in ------------------------------------------------------------------------

async function start() {
  try { me = tabToken() ? await api("/api/me") : null; } catch { me = null; }
  me ? enter() : showLogin();
}

async function showLogin() {
  clearInterval(timer);
  $("who").innerHTML = ""; $("meta").textContent = "";
  const d = await api("/api/departments");
  $("app").innerHTML = `<div class="panel login stack"><h2>Sign in</h2>
    <label class="small" for="ldept">Department</label>
    <select id="ldept">${d.departments.map((x) => `<option value="${esc(x.id)}">${esc(x.id)} (${x.faculty} teachers)</option>`).join("")}</select>
    <label class="small" for="lname">You are</label><select id="lname"></select>
    <input id="lclub" placeholder="The club's name" hidden>
    ${d.passwords ? `<label class="small" for="lpass">Password</label><input id="lpass" type="password" autocomplete="current-password">` :
      `<div class="small">This server signs people in by name alone: fine on your own machine, not on a network.</div>`}
    <button class="primary" id="lgo">Sign in</button><div class="small" id="lerr"></div></div>`;
  const fill = () => {
    const x = d.departments.find((y) => y.id === $("ldept").value);
    $("lname").innerHTML = [`<option value="office">The timetable office</option>`, ...x.teachers.map((t) => `<option>${esc(t)}</option>`),
      `<option value="club">A club…</option>`].join("");
    if (remember("nts.name")) $("lname").value = remember("nts.name");
    if (!$("lname").value) $("lname").value = "office";
    $("lclub").hidden = $("lname").value !== "club";
  };
  $("lname").onchange = () => { $("lclub").hidden = $("lname").value !== "club"; };
  $("ldept").onchange = fill;
  if (remember("nts.dept") && d.departments.some((x) => x.id === remember("nts.dept"))) $("ldept").value = remember("nts.dept");
  fill();
  const go = async () => {
    try {
      const name = $("lname").value === "club" ? `club: ${$("lclub").value.trim()}` : $("lname").value;
      const s = await api("/api/login", {method: "POST", body: JSON.stringify({dept: $("ldept").value, name, password: $("lpass")?.value || ""})});
      tabToken(s.token);
      remember("nts.dept", $("ldept").value); remember("nts.name", $("lname").value);
      me = await api("/api/me"); enter();
    } catch (e) { $("lerr").textContent = e.message; }
  };
  $("lgo").onclick = go;
  if ($("lpass")) $("lpass").onkeydown = (e) => { if (e.key === "Enter") go(); };
}

async function enter() {
  dep = await api("/api/department");
  meta();
  $("who").innerHTML = `<span>${esc(me.name)} <span class="small">· ${esc(me.role)} · ${esc(me.dept)}</span></span><span id="inboxDot"></span>
    ${me.role === "club" ? "" : `<span class="bellbox"><button class="link bell" id="bell" title="Notifications" aria-label="Notifications">🔔<span class="dot" id="bellDot" hidden></span></button>
      <div class="panel bell-panel" id="bellPanel" hidden></div></span>`}
    <button class="link" id="logout">Sign out</button>`;
  if ($("bell")) { $("bell").onclick = toggleBell; refreshBell(); }
  $("logout").onclick = async () => { await api("/api/logout", {method: "POST"}); tabToken(""); me = null; chat = null; showLogin(); };
  show(view);
  clearInterval(timer); timer = setInterval(() => {
    if (view === chatTab()) { refreshLists(); freshen(); }
    if (view === "requests" && me.role === "office") refreshOffice();
    refreshBell();
  }, 4000);
}

function meta() { $("meta").textContent = `${dep.model} · ${dep.agent} · version ${dep.version.slice(0, 8)}`; }

function show(which) {
  view = which;
  if (me.role === "club" && which === "requests") which = view = "bookings";
  const tabs = [...(me.role === "club" ? [] : [["requests", "Requests"]]), ...(me.role === "office" ? [["chat", "Agent chat"]] : []),
    ["timetable", "Timetable"], ["bookings", "Bookings"],
    ["fairness", "Fairness"], ["rules", "Rules"], ...(me.role === "office" ? [["semester", "Semester"], ["obs", "Observability"]] : [])];
  const bar = `<div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${k === which ? "on" : ""}">${l}</button>`).join("")}</div>`;
  if (which === "requests" && me.role === "office") officeView(bar);
  else if (which === chatTab()) requestsView(bar);
  else { $("app").innerHTML = `<main class="wide"><section>${bar}<div id="pane" class="panel stack"></div></section></main>`;
    ({timetable: timetableView, bookings: bookingsView, fairness: fairnessView, rules: rulesView, semester: semesterView,
      obs: obsView})[which](); }
  for (const b of document.querySelectorAll("[data-tab]")) b.onclick = () => show(b.dataset.tab);
}

// -- chat: conversations (threads) of requests ------------------------------------------------------------
// Each message is one agent episode; a thread is a conversation of them, and the agent remembers the earlier
// messages of the thread. Its steps fold into "Thinking", open while it works.

const STEP = {
  find: "Looked up a name", describe: "Read the details", classes_of: "Checked the classes", free_hours: "Checked free hours",
  who_is_free: "Checked who is free", free_rooms: "Checked free rooms", changes: "Checked recent changes", rules: "Searched the regulations",
  constrain: "Drafted a rule", move_class: "Drafted a move", retract: "Took back part of the draft", list_draft: "Read the draft",
  swap_classes: "Drafted a swap", cancel_class: "Drafted a cancellation", add_class: "Drafted an extra class",
  limit_hours: "Drafted an hours limit", book_room: "Drafted a room booking", move_to_window: "Drafted a move to a time window",
  limit_load: "Drafted a load limit", relate_classes: "Drafted how classes relate", choose: "Drafted a choice between options",
  set_weeks: "Set the weeks", check_draft: "Checked the draft with the solver", submit: "Sent the draft to the office",
  decline: "Declined", escalate: "Passed it to the office",
};
let chat = null;  // the open conversation: {id, mine, episodes: [...]}, or null for a new one
const chatTab = () => (me.role === "office" ? "chat" : "requests");

async function freshen() {  // the office may decide or write while a chat is open: fetch it again when idle
  if (!chat?.episodes || chat.episodes.some((e) => e.busy || e.status === "running")) return;
  try {
    const now = await api(`/api/threads/${chat.id}`);
    if (chat?.id === now.id && JSON.stringify(now) !== JSON.stringify(chat)) { chat = now; draw(); }
  } catch { /* gone, or the server is restarting */ }
}

// the side bar folds away, as in a chat app; the choice is remembered
const sideBar = (bar) => `<div class="row topbar"><button class="link side-btn" id="sideBtn" title="Show or hide the side bar"
  aria-label="Show or hide the side bar">☰</button>${bar}</div>`;

function sideToggle() {
  const main = document.querySelector("main.chat");
  main.classList.toggle("closed", remember("nts.side") === "closed");
  $("sideBtn").onclick = () => remember("nts.side", main.classList.toggle("closed") ? "closed" : "open");
}

function requestsView(bar) {
  $("app").innerHTML = `<main class="chat"><aside class="side stack">
      <button class="primary" id="newChat">+ New chat</button>
      <section id="inboxBox" hidden><h2>Waiting for you</h2><ul class="list" id="inbox"></ul></section>
      <section><h2>${me.role === "office" ? "All chats" : "Your chats"}</h2><ul class="list" id="threads"></ul></section>
    </aside><section class="convo">${sideBar(bar)}
      <div id="msgs" class="msgs"></div>
      <div class="composer panel">
        <textarea id="text" rows="2"></textarea>
        <div class="row"><label class="small" for="week">Week</label><select id="week">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
          <label class="small"><input type="checkbox" id="simulate"> stand-ins answer</label>
          <span class="small" id="sendErr"></span><button class="primary" id="send" style="margin-left:auto">Send</button></div>
      </div></section></main>`;
  $("week").value = remember("nts.week") || 5;
  $("week").onchange = () => remember("nts.week", $("week").value);
  $("simulate").checked = dep.simulate;
  $("send").onclick = send;
  sideToggle();
  $("newChat").onclick = () => { chat = null; if (source) source.close(); draw(); refreshLists(); $("text").focus(); };
  $("text").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
  refreshLists();
  if (chat) openThread(chat.id); else draw();
}

async function send() {
  const text = $("text").value.trim();
  if (!text) return;
  $("send").disabled = true; $("sendErr").textContent = "";
  try {
    const ep = await api("/api/episodes", {method: "POST", body: JSON.stringify({request: text, week: Number($("week").value),
      simulate: $("simulate").checked, thread: chat?.mine ? chat.id : null})});
    $("text").value = "";
    await openThread(ep.thread);
  } catch (e) { $("sendErr").textContent = e.message; $("send").disabled = false; }
}

async function refreshLists() {
  if (!$("threads")) return;
  try {
    const [ts, inbox] = await Promise.all([api("/api/threads"), api("/api/inbox")]);
    $("threads").innerHTML = ts.length ? ts.map((t) => `<li data-thread="${esc(t.id)}" class="${chat?.id === t.id ? "sel" : ""}">
        <div class="req">${esc(t.title)}</div><div class="row small"><span class="badge s-${esc(t.status)}">${label(t.status)}</span>
        ${t.messages > 1 ? `${t.messages} messages` : ""}${t.mine ? "" : ` · ${esc(t.actor)}`}</div></li>`).join("") : `<li class="small">No chats yet.</li>`;
    $("inboxBox").hidden = !inbox.length;
    $("inbox").innerHTML = inbox.map((e) => `<li data-thread="${esc(e.thread)}"><div class="req">${esc(e.pending?.text || e.request)}</div>
        <div class="small">from ${esc(e.actor)}</div></li>`).join("");
    if ($("inboxDot")) $("inboxDot").innerHTML = inbox.length ? `<span class="dot">${inbox.length}</span>` : "";
    for (const li of document.querySelectorAll("li[data-thread]")) li.onclick = () => openThread(li.dataset.thread);
  } catch { /* the server may be restarting */ }
}

async function openThread(id) {
  if (view !== chatTab()) { chat = {id}; show(chatTab()); return; }
  if (source) source.close();
  chat = await api(`/api/threads/${id}`);
  draw(); follow(); refreshLists();
}

function follow() {  // the last message's events, live
  const last = chat?.episodes?.at(-1);
  if (!last || !(last.busy || last.status === "running")) return;
  const id = chat.id, ep = last;
  source = new EventSource(`/api/episodes/${ep.id}/events?after=${ep.events.length}&token=${encodeURIComponent(tabToken() || "")}`);
  const take = async (msg) => {
    const e = JSON.parse(msg.data);
    if (chat?.id !== id || e.n < ep.events.length) return;
    ep.events.push(e);
    if (["end", "waiting", "decision"].includes(e.type)) { await openThread(id); return; }
    draw();
  };
  for (const t of ["model", "model_error", "tool", "reply", "waiting", "end", "decision", "note"]) source.addEventListener(t, take);
  source.onerror = () => source.close();  // the server ends the stream when the episode ends or waits
}

const args = (a) => Object.entries(a || {}).map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");
const brief = (a) => Object.values(a || {}).filter((v) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
  .map((v) => Array.isArray(v) ? v.join(", ") : typeof v === "object" ? JSON.stringify(v) : String(v)).join(" · ");

function stepHtml(e) {  // one step of the agent's work, in words; the raw call and result one click further
  if (e.type === "model") return e.text && e.calls.length ? `<li class="note">${esc(e.text)}</li>` : "";
  if (e.type === "tool") return `<li class="${e.ok ? "" : "bad"}">${e.ok ? "✓" : "✗"} ${esc(STEP[e.name] || e.name)}
      <span class="small">${esc(brief(e.arguments))}</span>${e.ok ? "" : ` <span class="small">: ${esc(e.result?.message || "")}</span>`}
      <details><summary>details</summary><div class="call">${esc(e.name)}(${esc(args(e.arguments))})</div><pre>${esc(JSON.stringify(e.result, null, 1))}</pre></details></li>`;
  if (e.type === "reply") {
    const what = e.kind === "offer" ? `Asked ${esc(e.to)} to waive “${esc(e.rule)}”` : e.kind === "notice" ? `Told ${esc(e.to)}` : `Asked ${esc(e.to)}`;
    const ans = e.kind === "notice" ? "" : ` → ${e.answer === "no_reply" ? "<i>no reply</i>" : `<b>${esc(e.answer)}</b> ${esc(e.says)}`}`;
    return `<li>💬 ${what}: “${esc(e.text)}”${ans}</li>`;
  }
  if (e.type === "model_error") return `<li class="bad">✗ The model failed: ${esc(e.error?.message || "")}</li>`;
  return "";
}

function episodeHtml(c) {
  const steps = c.events.map(stepHtml).filter(Boolean), working = c.busy || c.status === "running";
  const ms = c.events.reduce((t, e) => t + (e.ms || 0), 0), p = c.pending, can = c.can || {};
  let html = `<div class="msg user"><div class="bubble">${esc(c.request)}</div><div class="small">week ${c.week ?? "–"} · ${esc(c.started.slice(11, 16))}</div></div>
    <div class="msg agent">`;
  if (steps.length || working) html += `<details class="thinking" ${working ? "open" : ""}><summary>${working ? "Thinking…" : "Thought"} · ${steps.length} step${steps.length === 1 ? "" : "s"}${ms ? ` · ${(ms / 1000).toFixed(1)} s` : ""}</summary>
      <ol>${steps.join("")}${working ? `<li class="small">working…</li>` : ""}</ol></details>`;
  const end = c.events.findLast((e) => e.type === "end");
  if (!working && !p) {
    const text = c.text || end?.text || c.detail || end?.detail || "";
    html += `<div class="bubble">${c.status === "answered" ? "" : `<span class="badge s-${esc(c.status)}">${label(c.status)}</span> `}${esc(text)}</div>`;
  }
  if (p && !c.busy) {
    if (p.to_requester && c.can?.answer) html += `<div class="bubble ask">${esc(p.text)}
      ${p.options?.length ? `<div class="picks">${p.options.map((o) => `<button class="pick" data-pick="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}
      <div class="small">${p.options?.length ? "Pick one, or write your own answer below." : "Answer in the box below."}</div></div>`;
    else html += `<div class="callout stack"><div class="small">${p.kind === "offer" ? `An offer for ${esc(p.to)}` : `A question for ${esc(p.to)}`}</div>
      <div>“${esc(p.text)}”</div>${p.rule ? `<div class="small">Their rule: ${esc(p.rule)}; waived in ${p.weeks.length ? "week " + p.weeks.join(", ") : "every week"}</div>` : ""}
      ${can.answer ? `<textarea data-answer="${esc(c.id)}" placeholder="${p.kind === "offer" ? "Say why (optional)" : "Your answer"}"></textarea>
      <div class="row">${p.kind === "offer" ? `<button class="primary" data-a="yes" data-ep="${esc(c.id)}">Agree</button><button data-a="no" data-ep="${esc(c.id)}">Refuse</button>` :
        `<button class="primary" data-a="said" data-ep="${esc(c.id)}">Answer</button>`}<button data-a="no_reply" data-ep="${esc(c.id)}">Don't answer</button></div>` :
        `<div class="small">Waiting for ${esc(p.to)} to answer.</div>`}</div>`;
  }
  if (c.status === "submitted" || c.status === "replaced" || c.decision) {
    const head = c.decision ? (c.decision.approved ? "Approved by the office" : "Not approved" + (c.decision.note ? `: ${esc(c.decision.note)}` : ""))
      : c.status === "replaced" ? "Replaced by a later message" : "Sent to the office for approval";
    html += `<div class="callout ok stack"><div class="small">${head}</div>
      ${c.draft.length ? `<ul>${c.draft.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>` : ""}
      ${c.stale && c.status === "submitted" ? `<div class="small">The timetable changed since this draft was made; send the request again.</div>` : ""}
      ${can.decide && !c.stale ? `<div class="row"><button class="primary" data-decide="approve" data-ep="${esc(c.id)}">Approve and commit</button>
        <input data-note="${esc(c.id)}" placeholder="Note (for a rejection)"><button class="danger" data-decide="reject" data-ep="${esc(c.id)}">Reject</button></div>` : ""}</div>`;
  }
  html += c.notes.map((n) => `<div class="bubble office">${esc(n.text)}<div class="small">the office · ${esc((n.at || "").slice(11, 16))}</div></div>`).join("");
  return html + "</div>";
}

function draw() {
  if (!$("msgs")) return;
  for (const li of document.querySelectorAll("#threads li")) li.classList.toggle("sel", li.dataset.thread === chat?.id);
  const last = chat?.episodes?.at(-1), p = last?.pending;
  $("text").placeholder = !chat ? (me.role === "office" ? "e.g. Lab 2 is closed on Thursday next week for maintenance." :
      "e.g. When am I free on Monday?  ·  I have a conference next Tuesday, please move my classes that day.")
    : p?.to_requester ? "Answer the agent's question…" : "Ask a follow-up, or change what you asked…";
  const locked = !!chat && (!chat.mine || last.busy || last.status === "running" || (!!p && !p.to_requester));
  $("text").disabled = $("send").disabled = locked;
  if (!chat?.episodes) { $("msgs").innerHTML = `<div class="empty">Ask about your timetable, or ask for a change.<br>Each chat remembers what was said in it.</div>`; return; }
  const box = $("msgs"), atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  const open = new Set([...box.querySelectorAll("details.thinking[open]")].map((d) => d.closest("[data-ep-box]").dataset.epBox));
  box.innerHTML = chat.episodes.map((c) => `<div data-ep-box="${esc(c.id)}">${episodeHtml(c)}</div>`).join("");
  for (const d of box.querySelectorAll("details.thinking")) if (open.has(d.closest("[data-ep-box]").dataset.epBox)) d.open = true;
  if (atEnd) box.scrollTop = box.scrollHeight;
  for (const b of document.querySelectorAll("[data-a]")) b.onclick = () => answer(b.dataset.ep, b.dataset.a);
  for (const b of document.querySelectorAll("[data-pick]")) b.onclick = () => { $("text").value = b.dataset.pick; send(); };
  for (const b of document.querySelectorAll("[data-decide]")) b.onclick = () => decide(b.dataset.ep, b.dataset.decide);
}

async function answer(eid, kind) {
  const box = document.querySelector(`[data-answer="${eid}"]`), text = box?.value.trim() || "";
  if (kind === "said" && !text) { box.focus(); return; }
  try {
    await api(`/api/episodes/${eid}/reply`, {method: "POST", body: JSON.stringify({answer: kind, text})});
    await openThread(chat.id);
  } catch (e) { alert(e.message); }
}

async function decide(eid, what) {
  try {
    const note = document.querySelector(`[data-note="${eid}"]`)?.value || "";
    await api(`/api/episodes/${eid}/${what}`, {method: "POST", body: what === "reject" ? JSON.stringify({note}) : "{}"});
    await openThread(chat.id);
    dep = await api("/api/department"); meta();
  } catch (e) { alert(e.message); }
}

// -- the office's inbox: what reached it from teachers, one item each -----------------------------------------------
// A change sent for approval, or a request the agent passed on. Open one: approve, reject, or write to the teacher.

let officeOpen = null;  // the id of the request open in the office's inbox

function officeView(bar) {
  $("app").innerHTML = `<main class="chat"><aside class="side stack">
      <section><h2>Needs you</h2><ul class="list" id="oNeeds"></ul></section>
      <section><h2>Done</h2><ul class="list" id="oDone"></ul></section>
    </aside><section class="convo">${sideBar(bar)}<div id="oItem" class="msgs"></div></section></main>`;
  sideToggle();
  refreshOffice();
}

async function refreshOffice() {
  if (!$("oNeeds")) return;
  let items;
  try { items = await api("/api/office/requests"); } catch { return; }
  const li = (c) => `<li data-oid="${esc(c.id)}" class="${officeOpen === c.id ? "sel" : ""}"><div class="req">${esc(c.request)}</div>
    <div class="row small"><span class="badge s-${esc(c.status)}">${label(c.status === "submitted" ? "to approve" : c.status)}</span>${esc(c.actor)} · ${esc(c.started.slice(5, 16).replace("T", " "))}</div></li>`;
  const needs = items.filter((c) => c.needs_office), done = items.filter((c) => !c.needs_office);
  $("oNeeds").innerHTML = needs.map(li).join("") || `<li class="small">Nothing waits for the office.</li>`;
  $("oDone").innerHTML = done.map(li).join("") || `<li class="small">None yet.</li>`;
  if ($("inboxDot")) $("inboxDot").innerHTML = needs.length ? `<span class="dot">${needs.length}</span>` : "";
  for (const x of document.querySelectorAll("li[data-oid]")) x.onclick = () => { officeOpen = x.dataset.oid; drawOffice(items); refreshOffice(); };
  if (!officeOpen && needs.length) officeOpen = needs[0].id;
  drawOffice(items);
}

function drawOffice(items) {
  const c = items.find((x) => x.id === officeOpen);
  if (!c) { $("oItem").innerHTML = `<div class="empty">Requests that need the office show up here, one at a time.</div>`; return; }
  if ($("oItem").dataset.shown === `${c.id}:${c.status}:${c.notes.length}`) return;  // keep a half-written message
  $("oItem").dataset.shown = `${c.id}:${c.status}:${c.notes.length}`;
  const steps = c.events.map(stepHtml).filter(Boolean);
  const what = c.status === "submitted" ? "asks for this change" : c.status === "escalated" ? "was passed to the office" : label(c.status);
  const decided = c.decision ? `<div class="callout ${c.decision.approved ? "ok" : ""}">${c.decision.approved ? "Approved" : "Rejected"}
    ${c.decision.note ? `: ${esc(c.decision.note)}` : ""}</div>` : "";
  $("oItem").innerHTML = `<div class="panel stack office-item">
      <div class="small">${esc(c.actor)} · week ${c.week ?? "–"} · ${esc(c.started.replace("T", " "))} · <span class="badge s-${esc(c.status)}">${label(c.status)}</span></div>
      <div style="font-size:16px">“${esc(c.request)}”</div>
      <div class="small">${esc(c.actor)} ${what}.</div>
      ${c.text || c.detail ? `<div><b>The agent:</b> ${esc(c.text || c.detail)}</div>` : ""}
      ${c.draft.length ? `<div><b>Proposed changes</b><ul>${c.draft.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
      ${c.stale && c.status === "submitted" ? `<div class="callout">The timetable changed since this was drafted, so it can't be approved as it is. Tell ${esc(c.actor)} to send it again.</div>` : ""}
      ${steps.length ? `<details class="thinking"><summary>How the agent got here · ${steps.length} steps</summary><ol>${steps.join("")}</ol></details>` : ""}
      ${c.notes.map((n) => `<div class="msg agent"><div class="bubble office">${esc(n.text)}<div class="small">the office · ${esc((n.at || "").slice(11, 16))}</div></div></div>`).join("")}
      ${decided}
      <textarea id="oNote" placeholder="A message to ${esc(c.actor)} (optional with Approve or Reject)"></textarea>
      <div class="row">
        ${c.can.decide && !c.stale ? `<button class="primary" id="oYes">Approve</button><button class="danger" id="oNo">Reject</button>` : ""}
        <button id="oSay">Send message only</button><span class="small" id="oErr"></span></div></div>`;
  const act = async (path, body) => {
    try { await api(`/api/episodes/${c.id}/${path}`, {method: "POST", body: JSON.stringify(body)}); $("oItem").dataset.shown = "";
      await refreshOffice(); dep = await api("/api/department"); meta();
    } catch (e) { $("oErr").textContent = e.message; }
  };
  const note = () => $("oNote").value.trim();
  if ($("oYes")) $("oYes").onclick = () => act("approve", {note: note()});
  if ($("oNo")) $("oNo").onclick = () => act("reject", {note: note()});
  $("oSay").onclick = () => note() ? act("note", {note: note()}) : $("oNote").focus();
}


// -- notifications: a bell in the header ---------------------------------------------------------------------------
// Your requests approved or not, the office's messages, and other people's approved changes that move your classes.

const ICON = {approved: "✅", rejected: "⛔", not_committed: "⚠️", office: "✉️", affected: "📅"};
const HEAD = {approved: "Approved", rejected: "Not approved", not_committed: "Not committed", office: "The office wrote",
  affected: "Your classes changed"};
let told = [], toldNewest = null;  // the newest notice seen by this tab, so a newer one pops up once

const seenKey = () => `nts.seen.${me.dept}.${me.name}`;

async function refreshBell() {
  if (!$("bell")) return;
  try { told = await api("/api/notices"); } catch { return; }
  const seen = remember(seenKey()) || "";
  const fresh = told.filter((n) => n.at > seen).length;
  $("bellDot").textContent = fresh ? String(fresh) : "";
  $("bellDot").hidden = !fresh;
  const newest = told[0]?.at || "";
  if (toldNewest !== null && newest > toldNewest && newest > seen) toast(told[0]);
  toldNewest = newest;
  if (!$("bellPanel").hidden) drawBell();
}

function drawBell() {
  const seen = remember(seenKey()) || "";
  $("bellPanel").innerHTML = `<div class="row"><b>Notifications</b><button class="link" id="bellClose" style="margin-left:auto">Close</button></div>` +
    (told.length ? told.map((n, i) => `<div class="notice ${n.at > seen ? "new" : ""}" data-n="${i}">
      <div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b> <span class="small">· ${esc(n.at.slice(5, 16).replace("T", " "))}</span></div>
      ${n.mine ? `<div class="small">Your request: “${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div></div>`).join("")
      : `<div class="empty">Nothing yet. When the office decides on a request, or a change moves one of your classes, it shows up here.</div>`);
  $("bellClose").onclick = () => { $("bellPanel").hidden = true; };
  for (const x of document.querySelectorAll("[data-n]")) x.onclick = () => {
    const n = told[Number(x.dataset.n)];
    $("bellPanel").hidden = true;
    if (n.mine && me.role !== "office") openThread(n.thread);
    else if (n.kind === "affected") show("timetable");
  };
}

function toast(n) {  // a new notification, for a few seconds; a click opens the bell
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div");
  t.className = "toast panel";
  t.innerHTML = `<div>${ICON[n.kind] || "•"} <b>${esc(HEAD[n.kind] || n.kind)}</b></div>
    ${n.mine ? `<div class="small">“${esc(n.request)}”</div>` : ""}<div>${esc(n.text)}</div>`;
  t.onclick = () => { t.remove(); toggleBell(); };
  document.body.append(t);
  setTimeout(() => t.remove(), 8000);
}

function toggleBell() {
  $("bellPanel").hidden = !$("bellPanel").hidden;
  if (!$("bellPanel").hidden) {
    drawBell();
    if (told.length) remember(seenKey(), told[0].at);  // newest first: all of these are seen now
    $("bellDot").hidden = true;
  }
}

// -- timetable ----------------------------------------------------------------------------

function timetableView() {
  $("pane").innerHTML = `<div class="row"><label class="small" for="ttWeek">Week</label>
    <select id="ttWeek">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
    <label class="small" for="ttWho">Show</label><select id="ttWho"><option value="">Everyone</option>
    ${dep.teachers.map((t) => `<option value="t:${esc(t)}">${esc(t)}</option>`).join("")}${dep.sections.map((s) => `<option value="s:${esc(s)}">${esc(s)}</option>`).join("")}</select>
    <span class="small" id="ttNote"></span></div><div class="scroll" id="ttGrid"></div>`;
  $("ttWeek").value = remember("nts.week") || 5;
  if (me.role === "teacher") $("ttWho").value = `t:${me.name}`;
  $("ttWeek").onchange = $("ttWho").onchange = drawTimetable;
  drawTimetable();
}

async function drawTimetable() {
  const who = $("ttWho").value, q = new URLSearchParams({week: $("ttWeek").value});
  if (who.startsWith("t:")) q.set("teacher", who.slice(2));
  if (who.startsWith("s:")) q.set("section", who.slice(2));
  try {
    const t = await api(`/api/timetable?${q}`);
    $("ttNote").textContent = t.own ? "this week has its own timetable" : "the semester timetable runs this week";
    const cell = (day, h) => t.classes.filter((c) => c.day === day && c.from === h).map((c) =>
      `<div class="cls"><b>${esc(c.course)}</b>${esc(c.kind)} · ${esc(c.teacher)}<br>${esc(c.sections.join(", "))} · ${esc(c.room)}</div>`).join("");
    $("ttGrid").innerHTML = `<table class="grid"><tr><th class="h"></th>${dep.days.map((d) => `<th>${esc(d)}</th>`).join("")}</tr>` +
      dep.hours.slice(0, -1).map((h) => `<tr><td class="h">${esc(h)}${h === dep.lunch ? "<br>lunch" : ""}</td>${dep.days.map((d) => `<td>${cell(d, h)}</td>`).join("")}</tr>`).join("") + "</table>";
  } catch (e) { $("ttGrid").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// -- fairness and rules ----------------------------------------------------------------------

async function fairnessView() {
  const f = await api("/api/fairness");
  const top = Math.max(...f.teachers.map((t) => t.burden), 0.0001);
  $("pane").innerHTML = `<div class="tiles">
      <div class="tile"><div class="small">Concessions this term</div><div class="v">${f.concessions.length}</div></div>
      <div class="tile"><div class="small">Gini of the burden</div><div class="v">${f.spread.gini.toFixed(2)}</div><div class="small">0: even, 1: one person carries it</div></div>
      <div class="tile"><div class="small">Largest burden</div><div class="v">${f.spread.max.toFixed(2)}</div></div></div>
    <p class="small">When a teacher agrees to waive one of their rules for someone else's request, it counts here: the rule's weight
      (its tier and how it was justified) times how much was given up (some weeks: half; dropped: all). The agent asks
      first whoever has given way less.</p>
    <table class="data"><tr><th>Teacher</th><th>Given way</th><th>Burden</th><th style="width:35%"></th><th>For</th></tr>
    ${f.teachers.map((t) => `<tr><td>${esc(t.teacher)}</td><td class="n">${t.given_way}</td><td class="n">${t.burden.toFixed(2)}</td>
      <td><div class="bar" style="width:${(100 * t.burden / top).toFixed(1)}%"></div></td><td class="small">${esc(t.for.join(", "))}</td></tr>`).join("")}</table>`;
}

async function rulesView() {
  $("pane").innerHTML = dep.rules ? `<div class="row"><input id="rq" placeholder="Search the regulations: lunch, Saturday, make-up classes…" style="flex:1">
    </div><div id="rlist" class="stack"></div>` : `<div class="empty">No regulations are loaded for this department.</div>`;
  if (!dep.rules) return;
  let t = null;
  const draw = async () => {
    const r = await api(`/api/rules?q=${encodeURIComponent($("rq").value)}`);
    $("rlist").innerHTML = r.rules.map((x) => `<div class="rule"><h3>§${esc(x.number)} ${esc(x.title)} <span class="small">[${esc(x.id)}]</span></h3><div>${esc(x.text)}</div></div>`).join("")
      || `<div class="empty">No rule matches.</div>`;
  };
  $("rq").oninput = () => { clearTimeout(t); t = setTimeout(draw, 200); };
  draw();
}

  const rows = await api("/api/bookings");
  $("blist").innerHTML = rows.length ? `<table class="data"><tr><th>Week</th><th>When</th><th>Room</th><th>Club</th><th>What</th><th>People</th><th>Status</th><th></th></tr>
    ${rows.map((r) => `<tr><td class="n">${r.week}</td><td>${esc(r.day)} ${esc(r.from)}–${esc(r.to)}</td><td>${esc(r.room)}</td><td>${esc(r.club)}</td><td>${esc(r.purpose)}</td>
      <td class="n">${r.attendees}</td><td><span class="badge s-${r.status === "booked" ? "approved" : "waiting"}">${label(r.status)}</span></td>
      <td>${me.role === "office" && r.status === "needs_approval" ? `<button data-bok="${esc(r.id)}">Approve</button> <button class="danger" data-bno="${esc(r.id)}">Refuse</button>` :
        me.role === "office" || me.role === "club" ? `<button class="link" data-bx="${esc(r.id)}">Cancel</button>` : ""}</td></tr>`).join("")}</table>` : `<div class="empty">No bookings yet.</div>`;
  const act = (sel, f) => { for (const b of document.querySelectorAll(sel)) b.onclick = async () => { try { await f(b); } catch (e) { alert(e.message); } drawBookings(); }; };
  act("[data-bok]", (b) => api(`/api/bookings/${b.dataset.bok}/approve`, {method: "POST"}));
  act("[data-bno]", (b) => api(`/api/bookings/${b.dataset.bno}/refuse`, {method: "POST"}));
  act("[data-bx]", (b) => api(`/api/bookings/${b.dataset.bx}`, {method: "DELETE"}));
}

// -- the semester timetable (the office) --------------------------------------------------------------

async function semesterView() {
  $("pane").innerHTML = `<p class="small">During term every change is a repair that moves as few classes as it can, so wishes added one by one
    are met only where a repair allowed it. A rebuild solves the semester timetable again from nothing, with every standing rule and wish;
    weeks from the one you pick that have their own timetable are repaired on top of it, earlier weeks stay as they ran.
    Nothing changes until you publish it.</p>
    <div class="row"><label class="small" for="sweek">Repair weeks from</label><select id="sweek">${Array.from({length: dep.weeks}, (_, i) => `<option>${i + 1}</option>`).join("")}</select>
    <button class="primary" id="sgo">Rebuild</button></div><div id="sout"></div>`;
  $("sweek").value = remember("nts.week") || 5;
  $("sgo").onclick = async () => {
    try { await api("/api/semester/rebuild", {method: "POST", body: JSON.stringify({from_week: Number($("sweek").value)})}); } catch (e) { alert(e.message); }
    pollRebuild();
  };
  pollRebuild();
}

async function pollRebuild() {
  if (view !== "semester") return;
  const r = await api("/api/semester/rebuild");
  const st = r.stats;
  $("sout").innerHTML = r.status === "none" ? "" : r.status === "running" ? `<div class="small">Solving… (a minute at most)</div>` :
    r.status === "failed" ? `<div class="callout">${esc(r.error)}</div>` : r.status === "published" ? `<div class="callout ok">Published as version ${esc((r.version || "").slice(0, 8))}.</div>` :
    `<div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="small">Classes that move</div><div class="v">${st.moved} <span class="small">of ${st.classes}</span></div></div>
      <div class="tile"><div class="small">Wishes met now</div><div class="v">${st.met_before} <span class="small">of ${st.wishes}</span></div></div>
      <div class="tile"><div class="small">Wishes met after</div><div class="v">${st.met_after} <span class="small">of ${st.wishes}</span></div></div>
      <div class="tile"><div class="small">Weeks repaired / kept</div><div class="v">${st.weeks_repaired.length} / ${st.weeks_kept.length}</div></div></div>
      ${r.unmet.length ? `<details style="margin-top:8px"><summary>Wishes still not met (${r.unmet.length})</summary><ul>${r.unmet.map((u) => `<li>${esc(u)}</li>`).join("")}</ul></details>` : ""}
      ${r.stale ? `<div class="callout" style="margin-top:8px">The timetable changed since this rebuild; rebuild again.</div>` :
        `<div class="row" style="margin-top:12px"><button class="primary" id="spub">Publish</button></div>`}`;
  if ($("spub")) $("spub").onclick = async () => { try { await api("/api/semester/publish", {method: "POST"}); dep = await api("/api/department"); meta(); } catch (e) { alert(e.message); } pollRebuild(); };
  if (r.status === "running") setTimeout(pollRebuild, 1000);
}

// -- observability (the office) -----------------------------------------------------------------

async function obsView() {
  $("pane").innerHTML = `<div class="row"><label class="small" for="days">Last</label><select id="days"><option>1</option><option selected>7</option><option>30</option><option>365</option></select><span class="small">days</span></div>
    <div id="otiles"></div><div id="omodels"></div><div class="row"><div id="oerr" style="flex:1;min-width:260px"></div><div id="otools" style="flex:1;min-width:260px"></div></div>
    <h2>Episodes</h2><div class="row"><select id="ostatus"><option value="">any status</option>${["answered", "submitted", "declined", "escalated", "waiting", "budget_exhausted", "stuck", "model_error"].map((s) => `<option value="${s}">${label(s)}</option>`).join("")}</select>
    <select id="overdict"><option value="">any verdict</option><option>passed</option><option>failed</option><option>approved</option><option>rejected</option></select>
    <input id="omodel" placeholder="model contains…"></div><div class="scroll" id="oeps"></div><div id="otrace"></div>
    <h2>Eval reports</h2><div class="scroll" id="oevals"></div>`;
  $("days").onchange = overview;
  $("ostatus").onchange = $("overdict").onchange = $("omodel").onchange = episodesTable;
  overview(); episodesTable(); evals();
}

async function overview() {
  const o = await api(`/api/obs/overview?days=${$("days").value}`);
  const s = o.status;
  $("otiles").innerHTML = `<div class="tiles">${[["Episodes", o.episodes], ["Submitted", s.submitted || 0], ["Answered", s.answered || 0],
    ["Declined or escalated", (s.declined || 0) + (s.escalated || 0)], ["Failed to finish", (s.budget_exhausted || 0) + (s.stuck || 0) + (s.model_error || 0)]]
    .map(([k, v]) => `<div class="tile"><div class="small">${k}</div><div class="v">${v}</div></div>`).join("")}</div>`;
  $("omodels").innerHTML = `<h2 style="margin-top:16px">Models</h2><div class="scroll"><table class="data"><tr><th>Model</th><th>Episodes</th><th>Judged pass</th><th>Tokens</th><th>Calls refused</th><th>Seconds</th></tr>
    ${o.models.map((m) => `<tr><td>${esc(m.model)}</td><td class="n">${m.episodes}</td><td class="n">${m.judged ? `${m.passed}/${m.judged} (${Math.round(100 * m.passed / m.judged)}%)` : "–"}</td>
      <td class="n">${m.tokens.toLocaleString()}</td><td class="n">${m.tool_calls ? `${m.refused}/${m.tool_calls}` : "–"}</td><td class="n">${Math.round(m.seconds)}</td></tr>`).join("")}</table></div>`;
  const bars = (title, rows) => { const top = Math.max(...rows.map((r) => r[1]), 1);
    return `<h2 style="margin-top:16px">${title}</h2><table class="data">${rows.map(([k, v]) => `<tr><td>${label(k)}</td><td class="n">${v}</td><td style="width:45%"><div class="bar" style="width:${(100 * v / top).toFixed(1)}%"></div></td></tr>`).join("") || `<tr><td class="small">none</td></tr>`}</table>`; };
  $("oerr").innerHTML = bars("Refused calls, by reason", o.errors);
  $("otools").innerHTML = bars("Tool calls", o.tools);
}

async function episodesTable() {
  const q = new URLSearchParams({limit: 100});
  if ($("ostatus").value) q.set("status", $("ostatus").value);
  if ($("overdict").value) q.set("verdict", $("overdict").value);
  if ($("omodel").value) q.set("model", $("omodel").value);
  const eps = await api(`/api/obs/episodes?${q}`);
  $("oeps").innerHTML = `<table class="data"><tr><th>When</th><th>Request</th><th>Model</th><th>Status</th><th>Verdict</th><th>Turns</th><th>Refused</th><th>Tokens</th></tr>
    ${eps.map((e) => `<tr class="click" data-trace="${esc(e.id)}"><td class="small">${esc(e.start.replace("T", " "))}</td><td>${esc(e.request)}${e.family ? ` <span class="small">${esc(e.family)}</span>` : ""}</td>
      <td class="small">${esc(e.model)}</td><td><span class="badge s-${esc(e.status)}">${label(e.status)}</span></td>
      <td>${e.verdict ? `<span class="badge s-${esc(e.verdict)}">${esc(e.verdict)}</span>` : ""}</td><td class="n">${e.turns}</td><td class="n">${e.refused}</td><td class="n">${e.tokens.toLocaleString()}</td></tr>`).join("")}</table>`;
  for (const tr of document.querySelectorAll("tr[data-trace]")) tr.onclick = () => trace(tr.dataset.trace);
}

async function trace(id) {
  const spans = await api(`/api/obs/trace/${id}`);
  const line = (s) => {
    const a = s.attrs;
    if (s.kind === "model_call") { const r = a.response || {}; return `${esc(r.text || "")} ${(r.tool_calls || []).map((c) => `<span class="call">${esc(c.name)}(${esc(args(c.arguments))})</span>`).join(" ")}`; }
    if (s.kind === "tool_call") return a.ok ? "ok" : `<span class="s-failed">${esc(a.result?.error?.code)}: ${esc(a.result?.error?.message)}</span>`;
    if (s.kind === "reply") return `“${esc(a.ask?.text)}” → ${esc(a.reply?.answer)} ${esc(a.reply?.text)}`;
    if (s.kind === "evaluation") return a.passed ? `<span class="s-passed">passed</span>` : `<span class="s-failed">failed: ${esc((a.failures || []).join("; "))}</span>`;
    if (s.kind === "episode" || s.kind === "resume") return `${label(a.status)} ${esc(a.text || a.detail || "")}`;
    if (s.kind === "approval") return a.committed ? "committed" : `not committed ${esc(a.note || a.reason || "")}`;
    return "";
  };
  $("otrace").innerHTML = `<div class="panel stack" style="margin-top:12px"><div class="row"><h2 style="margin:0">Trace ${esc(id)}</h2><button class="link" id="tclose" style="margin-left:auto">Close</button></div>
    <table class="data"><tr><th>Span</th><th>Name</th><th>ms</th><th>What</th></tr>${spans.filter((s) => s.kind !== "turn").map((s) =>
      `<tr><td class="small">${esc(s.kind)}</td><td>${esc(s.name)}</td><td class="n">${Math.round(s.ms)}</td><td>${line(s)}<details><summary>attributes</summary><pre>${esc(JSON.stringify(s.attrs, null, 1))}</pre></details></td></tr>`).join("")}</table></div>`;
  $("tclose").onclick = () => { $("otrace").innerHTML = ""; };
  $("otrace").scrollIntoView({behavior: "smooth"});
}

async function evals() {
  const r = await api("/api/obs/evals");
  $("oevals").innerHTML = `<table class="data"><tr><th>Report</th><th>Model</th><th>When</th><th>Passed</th><th>Families</th></tr>
    ${r.map((x) => `<tr><td>${esc(x.report)}</td><td class="small">${esc(x.model)}</td><td class="small">${esc(x.when.replace("T", " "))}</td>
      <td class="n">${x.n ? `${x.passed}/${x.n}` : "–"}</td><td class="small">${Object.entries(x.families).map(([k, v]) => `${esc(k)} ${esc(v)}`).join(" · ")}</td></tr>`).join("")}</table>`;
}

start().catch((e) => { $("app").innerHTML = `<div class="empty">Could not reach the API: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
