[project]
name = "negotiate-then-solve"
version = "0.1.0"
description = "Conflict-aware university timetabling with LLM agents and constraint solvers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=2.25.0",
    "networkx>=3.3",
    "ortools>=9.10",
    "pydantic>=2.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.30",
    # policy documents: PDF text layers and rendering, HTML, images and OCR
    "beautifulsoup4>=4.12",
    "pillow>=10",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.4",
    "fastembed>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nts", "src/core", "src/language", "src/agents", "src/pipeline", "src/semester", "src/training", "src/evaluation", "src/web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: department-size solves (deselect with -m 'not slow')",
]

[project.scripts]
nts-web = "web.app:run"

[tool.ruff]
# Kaggle notebooks: shell lines, and imports in the order they must run (unsloth first)
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Times are the department's wall-clock times: the timetable, the request log
# and the file stamps carry no time zone, so naive datetimes are intended.
ignore = ["DTZ"]

[tool.ruff.lint.per-file-ignores]
"src/web/*.py" = ["B008"]  # FastAPI declares dependencies as defaults: Depends(view("semester"))

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["agents.priority.Weights"]  # a frozen dataclass
